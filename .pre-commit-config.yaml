repos:

# basic housekeeping hooks (trailing spaces, EOF fixer, yaml check, big files)
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: trailing-whitespace
    - id: end-of-file-fixer
    - id: check-yaml
    - id: check-added-large-files

# Use the project's locked tools for the same checks as make check.
- repo: local
  hooks:
    - id: ruff-check
      name: Ruff lint
      entry: uv run --frozen ruff check --fix .
      language: system
      files: '(\.pyi?$|^(pyproject\.toml|uv\.lock|\.pre-commit-config\.yaml)$)'
      pass_filenames: false
    - id: ruff-format
      name: Ruff format
      entry: uv run --frozen ruff format .
      language: system
      files: '(\.pyi?$|^(pyproject\.toml|uv\.lock|\.pre-commit-config\.yaml)$)'
      pass_filenames: false
    - id: mypy
      name: mypy
      entry: uv run --frozen mypy
      language: system
      files: '(\.pyi?$|^(pyproject\.toml|uv\.lock|\.pre-commit-config\.yaml)$)'
      pass_filenames: false
